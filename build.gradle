plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '1.3'
group = 'de.sarocesch.boostedbrightness'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    accessTransformers.from layout.projectDirectory.file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'boostedbrightness'
        }
        register('client')
        register('server') { args '--nogui' }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', 'boostedbrightness', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.2')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

jar {
    manifest {
        attributes([
            "MixinConfigs": "boostedbrightness.mixins.json"
        ])
    }
    // Exclude dev-mode MANIFEST.MF from resources — jar task generates its own
    exclude 'META-INF/MANIFEST.MF'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge 26.3 ships Mixin 0.8.7 (max class version 65): restamp mixin classes so they get applied
tasks.named('compileJava') {
    doLast { task ->
        task.destinationDirectory.get().asFile.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.class') || !f.path.replace(File.separator, '/').contains('/mixin/')) return
            byte[] b = f.bytes
            if (b.length > 7 && ((b[7] & 0xFF) > 65)) { b[6] = 0; b[7] = (byte) 65; f.bytes = b }
        }
    }
}
